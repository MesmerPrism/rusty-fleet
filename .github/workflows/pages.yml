name: GitHub Pages and renewable release metadata

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/pages.yml
      - packaging/windows/New-WindowsPagesDeployment.ps1
      - packaging/windows/New-WindowsReleaseDescriptor.ps1
      - packaging/windows/Publish-WindowsRelease.ps1
      - packaging/windows/Publication.Remote.psm1
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-release-metadata
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.FLEET_METADATA_DEPLOYMENT_ENABLED == 'true'
    environment: windows-release-metadata
    runs-on: windows-latest
    env:
      VERSION: ${{ vars.FLEET_METADATA_VERSION }}
      CHANNEL: ${{ vars.FLEET_METADATA_CHANNEL }}
      SOURCE_REVISION: ${{ vars.FLEET_METADATA_SOURCE_REVISION }}
      SOURCE_TREE: ${{ vars.FLEET_METADATA_SOURCE_TREE }}
      FLEET_SIGNER_THUMBPRINT: ${{ vars.FLEET_SIGNER_THUMBPRINT }}
      HOSTESS_SIGNER_THUMBPRINT: ${{ vars.HOSTESS_SIGNER_THUMBPRINT }}
      DESCRIPTOR_SIGNER_SPKI_SHA256: ${{ vars.FLEET_DESCRIPTOR_SIGNER_SPKI_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Retain the public site from the triggering revision
        shell: pwsh
        run: |
          $publicSite = Join-Path $env:RUNNER_TEMP 'fleet-public-site'
          if (Test-Path -LiteralPath $publicSite) {
            throw 'public site staging directory already exists'
          }
          Copy-Item `
            -LiteralPath .\site `
            -Destination $publicSite `
            -Recurse

      - name: Validate exact release and renewal configuration
        shell: pwsh
        run: |
          if ($env:VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or
              $env:CHANNEL -cnotmatch '^(?:dev|preview|stable)$' -or
              $env:SOURCE_REVISION -cnotmatch '^[0-9a-f]{40}$' -or
              $env:SOURCE_TREE -cnotmatch '^[0-9a-f]{40}$' -or
              $env:FLEET_SIGNER_THUMBPRINT -cnotmatch '^[0-9A-F]{40}$' -or
              $env:HOSTESS_SIGNER_THUMBPRINT -cnotmatch '^[0-9A-F]{40}$' -or
              $env:DESCRIPTOR_SIGNER_SPKI_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'renewal public trust inputs are absent or malformed'
          }
          $tag = "v$env:VERSION"
          & git switch --detach $tag
          if ($LASTEXITCODE -ne 0) {
            throw 'exact release tag checkout failed'
          }
          $head = (& git rev-parse HEAD).Trim()
          $tagCommit = (& git rev-parse "$tag^{commit}").Trim()
          $tree = (& git rev-parse "$env:SOURCE_REVISION^{tree}").Trim()
          $status = @(& git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or
              $head -cne $env:SOURCE_REVISION -or
              $tagCommit -cne $env:SOURCE_REVISION -or
              $tree -cne $env:SOURCE_TREE -or
              $status.Count -ne 0) {
            throw 'renewal checkout is not the exact clean release tag, commit, and tree'
          }
          $policy = Get-Content `
            -LiteralPath .\packaging\windows\trust\release-policy.json `
            -Raw |
            ConvertFrom-Json -Depth 10
          if ($policy.schema -cne 'rusty.fleet.windows_release_trust_policy.v1' -or
              $policy.publication_enabled -ne $true -or
              @($policy.authorized_fleet_signer_thumbprints) -cnotcontains
                $env:FLEET_SIGNER_THUMBPRINT -or
              @($policy.authorized_hostess_signer_thumbprints) -cnotcontains
                $env:HOSTESS_SIGNER_THUMBPRINT -or
              @($policy.authorized_descriptor_signer_spki_sha256) -cnotcontains
                $env:DESCRIPTOR_SIGNER_SPKI_SHA256) {
            throw 'tagged release policy does not authorize metadata renewal'
          }

      - name: Download and verify the exact visible GitHub Release
        shell: pwsh
        run: |
          Import-Module .\packaging\windows\Publication.Remote.psm1 -Force
          $tag = "v$env:VERSION"
          $download = Join-Path $env:RUNNER_TEMP 'fleet-release-assets'
          if (Test-Path -LiteralPath $download) {
            throw 'release download directory already exists'
          }
          [IO.Directory]::CreateDirectory($download) | Out-Null
          [void] (Resolve-RustyFleetRemoteTagCommit `
            -GitHubRepository 'MesmerPrism/rusty-fleet' `
            -Tag $tag `
            -ExpectedSourceRevision $env:SOURCE_REVISION `
            -GhExecutable 'gh')
          $remote = Get-RustyFleetRemoteReleaseByTag `
            -GitHubRepository 'MesmerPrism/rusty-fleet' `
            -Tag $tag `
            -GhExecutable 'gh'
          if ($null -eq $remote -or
              $remote.tag_name -cne $tag -or
              $remote.draft -ne $false -or
              $remote.prerelease -ne ($env:CHANNEL -cne 'stable')) {
            throw 'the exact visible GitHub Release is unavailable'
          }
          & gh release download $tag `
            --repo MesmerPrism/rusty-fleet `
            --dir $download
          if ($LASTEXITCODE -ne 0) {
            throw 'exact GitHub Release asset download failed'
          }
          $bundle = "RustyFleet-$env:VERSION-win-x64"
          $expectedNames = @(
            'RustyFleet-Setup.exe',
            "$bundle.zip",
            "$bundle.zip.sha256",
            "$bundle.manifest.json",
            "$bundle.checksums.sha256",
            "$bundle.validation-receipt.json",
            'RustyFleet-Setup.build-receipt.json',
            'release.json',
            'release-descriptor.receipt.json',
            'release-descriptor.spki.der'
          ) | Sort-Object
          $files = @(Get-ChildItem -LiteralPath $download -File -Force)
          $observedNames = @($files.Name | Sort-Object)
          if ($files.Count -ne 10 -or
              ($observedNames -join "`n") -cne ($expectedNames -join "`n")) {
            throw 'downloaded GitHub Release asset inventory is not closed'
          }
          $inventory = @($files | ForEach-Object {
            [pscustomobject]@{
              name = $_.Name
              sha256 = (
                Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              ).Hash.ToLowerInvariant()
              size_bytes = $_.Length
              path = $_.FullName
            }
          })
          [void] (Assert-RustyFleetRemoteAssetInventory `
            -ExpectedAssets $inventory `
            -RemoteAssets @($remote.assets))

      - name: Generate fresh signed metadata for the immutable Setup
        shell: pwsh
        env:
          FLEET_DESCRIPTOR_SIGNING_KEY_PEM_BASE64: ${{ secrets.FLEET_DESCRIPTOR_SIGNING_KEY_PEM_BASE64 }}
        run: |
          if (-not $env:FLEET_DESCRIPTOR_SIGNING_KEY_PEM_BASE64) {
            throw 'metadata renewal requires the protected descriptor signing key'
          }
          $download = Join-Path $env:RUNNER_TEMP 'fleet-release-assets'
          $metadata = Join-Path $env:RUNNER_TEMP 'fleet-renewed-metadata'
          $key = Join-Path $env:RUNNER_TEMP 'fleet-descriptor-signing-key.pem'
          try {
            [IO.File]::WriteAllBytes(
              $key,
              [Convert]::FromBase64String(
                $env:FLEET_DESCRIPTOR_SIGNING_KEY_PEM_BASE64
              )
            )
            $issued = [DateTimeOffset]::UtcNow
            $descriptorId = (
              "v$env:VERSION-$env:CHANNEL-" +
              $issued.ToUnixTimeMilliseconds()
            )
            .\packaging\windows\New-WindowsReleaseDescriptor.ps1 `
              -Version $env:VERSION `
              -Channel $env:CHANNEL `
              -SetupPath (Join-Path $download 'RustyFleet-Setup.exe') `
              -SetupBuildReceiptPath (
                Join-Path $download 'RustyFleet-Setup.build-receipt.json'
              ) `
              -ExpectedSetupSignerThumbprint $env:FLEET_SIGNER_THUMBPRINT `
              -ExpectedSourceRevision $env:SOURCE_REVISION `
              -ExpectedSourceTree $env:SOURCE_TREE `
              -DescriptorPrivateKeyPemPath $key `
              -ExpectedDescriptorSignerSpkiSha256 (
                $env:DESCRIPTOR_SIGNER_SPKI_SHA256
              ) `
              -OutputDirectory $metadata `
              -DescriptorId $descriptorId `
              -IssuedAtUtc $issued `
              -LifetimeMinutes 1380
          }
          finally {
            if (Test-Path -LiteralPath $key) {
              Remove-Item -LiteralPath $key -Force
            }
          }

      - name: Preflight the renewed descriptor against the closed release
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'fleet-release-assets'
          $metadata = Join-Path $env:RUNNER_TEMP 'fleet-renewed-metadata'
          $stage = Join-Path $env:RUNNER_TEMP 'fleet-renewal-preflight'
          [IO.Directory]::CreateDirectory($stage) | Out-Null
          $bundle = "RustyFleet-$env:VERSION-win-x64"
          foreach ($name in @(
            'RustyFleet-Setup.exe',
            "$bundle.zip",
            "$bundle.zip.sha256",
            "$bundle.manifest.json",
            "$bundle.checksums.sha256",
            "$bundle.validation-receipt.json",
            'RustyFleet-Setup.build-receipt.json'
          )) {
            Copy-Item `
              -LiteralPath (Join-Path $download $name) `
              -Destination (Join-Path $stage $name)
          }
          foreach ($name in @(
            'release.json',
            'release-descriptor.receipt.json',
            'release-descriptor.spki.der'
          )) {
            Copy-Item `
              -LiteralPath (Join-Path $metadata $name) `
              -Destination (Join-Path $stage $name)
          }
          Copy-Item `
            -LiteralPath .\packaging\windows\trust\release-policy.json `
            -Destination (Join-Path $stage 'release-policy.json')
          $receipt = .\packaging\windows\Publish-WindowsRelease.ps1 `
            -Mode Preflight `
            -AssetDirectory $stage `
            -Version $env:VERSION `
            -Channel $env:CHANNEL `
            -ExpectedFleetSignerThumbprint $env:FLEET_SIGNER_THUMBPRINT `
            -ExpectedHostessSignerThumbprint $env:HOSTESS_SIGNER_THUMBPRINT `
            -ExpectedDescriptorSignerSpkiSha256 (
              $env:DESCRIPTOR_SIGNER_SPKI_SHA256
            ) `
            -ExpectedSourceRevision $env:SOURCE_REVISION `
            -ExpectedSourceTree $env:SOURCE_TREE `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -ExpectedRef "refs/tags/v$env:VERSION"
          [IO.File]::WriteAllText(
            (Join-Path $env:RUNNER_TEMP 'metadata-preflight.json'),
            $receipt,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Read the prior deployed handoff if one exists
        shell: pwsh
        run: |
          $uri = (
            "https://mesmerprism.com/Rusty-Fleet/metadata/" +
            "$env:CHANNEL/deployment-handoff.json"
          )
          $response = Invoke-WebRequest -Uri $uri -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            [IO.File]::WriteAllText(
              (Join-Path $env:RUNNER_TEMP 'previous-handoff.json'),
              [string] $response.Content,
              [Text.UTF8Encoding]::new($false)
            )
          }
          elseif ($response.StatusCode -ne 404) {
            throw 'prior Pages metadata handoff lookup failed closed'
          }

      - name: Stage a binary-free resumable Pages artifact
        shell: pwsh
        run: |
          $arguments = @{
            Version = $env:VERSION
            Channel = $env:CHANNEL
            SiteDirectory = (Join-Path $env:RUNNER_TEMP 'fleet-public-site')
            MetadataDirectory = (
              Join-Path $env:RUNNER_TEMP 'fleet-renewed-metadata'
            )
            PublicationPreflightReceiptPath = (
              Join-Path $env:RUNNER_TEMP 'metadata-preflight.json'
            )
            ExpectedSourceRevision = $env:SOURCE_REVISION
            ExpectedSourceTree = $env:SOURCE_TREE
            ExpectedDescriptorSignerSpkiSha256 = (
              $env:DESCRIPTOR_SIGNER_SPKI_SHA256
            )
            OutputDirectory = (
              Join-Path $env:RUNNER_TEMP 'fleet-pages-artifact'
            )
          }
          $previous = Join-Path $env:RUNNER_TEMP 'previous-handoff.json'
          if (Test-Path -LiteralPath $previous -PathType Leaf) {
            $arguments.PreviousHandoffPath = $previous
          }
          $handoff = (
            .\packaging\windows\New-WindowsPagesDeployment.ps1 @arguments
          )
          [IO.File]::WriteAllText(
            (Join-Path $env:RUNNER_TEMP 'metadata-deployment-handoff.json'),
            $handoff,
            [Text.UTF8Encoding]::new($false)
          )

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload binary-free Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/fleet-pages-artifact

      - name: Upload renewal evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RustyFleet-${{ vars.FLEET_METADATA_CHANNEL }}-metadata-renewal-evidence
          path: |
            ${{ runner.temp }}/metadata-preflight.json
            ${{ runner.temp }}/metadata-deployment-handoff.json
            ${{ runner.temp }}/fleet-renewed-metadata/release.json
            ${{ runner.temp }}/fleet-renewed-metadata/release-descriptor.receipt.json
          if-no-files-found: error

  deploy:
    needs: prepare
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact signed metadata and human documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
