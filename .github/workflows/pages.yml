name: GitHub Pages and renewable release metadata

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/pages.yml
      - packaging/windows/New-WindowsPagesDeployment.ps1
      - packaging/windows/New-WindowsReleaseDescriptor.ps1
      - packaging/windows/Publish-WindowsRelease.ps1
      - packaging/windows/Publication.Remote.psm1
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-release-metadata
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.FLEET_METADATA_DEPLOYMENT_ENABLED == 'true'
    environment: windows-release-metadata
    runs-on: windows-latest
    env:
      VERSION: ${{ vars.FLEET_METADATA_VERSION }}
      CHANNEL: ${{ vars.FLEET_METADATA_CHANNEL }}
      MATURITY: ${{ vars.FLEET_METADATA_MATURITY }}
      RELEASE_TAG: ${{ vars.FLEET_METADATA_TAG }}
      SOURCE_REVISION: ${{ vars.FLEET_METADATA_SOURCE_REVISION }}
      SOURCE_TREE: ${{ vars.FLEET_METADATA_SOURCE_TREE }}
      FLEET_SIGNER_THUMBPRINT: ${{ vars.FLEET_SIGNER_THUMBPRINT }}
      HOSTESS_SIGNER_THUMBPRINT: ${{ vars.HOSTESS_SIGNER_THUMBPRINT }}
      DESCRIPTOR_SIGNER_SPKI_SHA256: ${{ vars.FLEET_DESCRIPTOR_SIGNER_SPKI_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Retain the public site from the triggering revision
        shell: pwsh
        run: |
          $publicSite = Join-Path $env:RUNNER_TEMP 'fleet-public-site'
          if (Test-Path -LiteralPath $publicSite) {
            throw 'public site staging directory already exists'
          }
          Copy-Item `
            -LiteralPath .\site `
            -Destination $publicSite `
            -Recurse

      - name: Validate exact release and renewal configuration
        shell: pwsh
        run: |
          if ($env:VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or
              $env:CHANNEL -cnotmatch '^(?:labs|stable)$' -or
              $env:MATURITY -cnotmatch '^(?:alpha|beta|rc|released)$' -or
              $env:SOURCE_REVISION -cnotmatch '^[0-9a-f]{40}$' -or
              $env:SOURCE_TREE -cnotmatch '^[0-9a-f]{40}$' -or
              $env:FLEET_SIGNER_THUMBPRINT -cnotmatch '^[0-9A-F]{40}$' -or
              $env:HOSTESS_SIGNER_THUMBPRINT -cnotmatch '^[0-9A-F]{40}$' -or
              $env:DESCRIPTOR_SIGNER_SPKI_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'renewal public trust inputs are absent or malformed'
          }
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "v$env:VERSION" }
          $tagPattern = if ($env:MATURITY -eq 'released') {
            '^v[0-9]+\.[0-9]+\.[0-9]+$'
          } else {
            '^v[0-9]+\.[0-9]+\.[0-9]+-' + $env:MATURITY + '\.[1-9][0-9]*$'
          }
          if ($tag -cnotmatch $tagPattern) {
            throw 'metadata tag does not match its explicit maturity'
          }
          "RESOLVED_RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          & git switch --detach $tag
          if ($LASTEXITCODE -ne 0) {
            throw 'exact release tag checkout failed'
          }
          $head = (& git rev-parse HEAD).Trim()
          $tagCommit = (& git rev-parse "$tag^{commit}").Trim()
          $tree = (& git rev-parse "$env:SOURCE_REVISION^{tree}").Trim()
          $status = @(& git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or
              $head -cne $env:SOURCE_REVISION -or
              $tagCommit -cne $env:SOURCE_REVISION -or
              $tree -cne $env:SOURCE_TREE -or
              $status.Count -ne 0) {
            throw 'renewal checkout is not the exact clean release tag, commit, and tree'
          }
          Import-Module .\packaging\windows\Distribution.Common.psm1 -Force
          $policy = Read-RustyFleetReleaseTrustPolicy `
            -LiteralPath .\packaging\windows\trust\release-policy.json `
            -Channel $env:CHANNEL
          if ($policy.publication_enabled -ne $true -or
              $policy.authenticode.thumbprint -cne
                $env:FLEET_SIGNER_THUMBPRINT -or
              $policy.authenticode.thumbprint -cne
                $env:HOSTESS_SIGNER_THUMBPRINT -or
              @($policy.authorized_descriptor_signer_spki_sha256) -cnotcontains
                $env:DESCRIPTOR_SIGNER_SPKI_SHA256) {
            throw 'tagged release policy does not authorize metadata renewal'
          }

      - name: Download and verify the exact visible GitHub Release
        shell: pwsh
        run: |
          Import-Module .\packaging\windows\Publication.Remote.psm1 -Force
          $tag = $env:RESOLVED_RELEASE_TAG
          $download = Join-Path $env:RUNNER_TEMP 'fleet-release-assets'
          if (Test-Path -LiteralPath $download) {
            throw 'release download directory already exists'
          }
          [IO.Directory]::CreateDirectory($download) | Out-Null
          [void] (Resolve-RustyFleetRemoteTagCommit `
            -GitHubRepository 'MesmerPrism/rusty-fleet' `
            -Tag $tag `
            -ExpectedSourceRevision $env:SOURCE_REVISION `
            -GhExecutable 'gh')
          $remote = Get-RustyFleetRemoteReleaseByTag `
            -GitHubRepository 'MesmerPrism/rusty-fleet' `
            -Tag $tag `
            -GhExecutable 'gh'
          if ($null -eq $remote -or
              $remote.tag_name -cne $tag -or
              $remote.draft -ne $false -or
              $remote.prerelease -ne ($env:CHANNEL -cne 'stable')) {
            throw 'the exact visible GitHub Release is unavailable'
          }
          & gh release download $tag `
            --repo MesmerPrism/rusty-fleet `
            --dir $download
          if ($LASTEXITCODE -ne 0) {
            throw 'exact GitHub Release asset download failed'
          }
          $productStem = if ($env:CHANNEL -ceq 'labs') {
            'RustyFleet-Labs'
          } else {
            'RustyFleet'
          }
          $setupName = "$productStem-Setup.exe"
          $setupReceiptName = "$productStem-Setup.build-receipt.json"
          $bundle = "$productStem-$env:VERSION-win-x64"
          $expectedNames = @(
            $setupName,
            "$bundle.zip",
            "$bundle.zip.sha256",
            "$bundle.manifest.json",
            "$bundle.checksums.sha256",
            "$bundle.validation-receipt.json",
            $setupReceiptName,
            'release.json',
            'release-descriptor.receipt.json',
            'release-descriptor.spki.der'
          ) | Sort-Object
          $files = @(Get-ChildItem -LiteralPath $download -File -Force)
          $observedNames = @($files.Name | Sort-Object)
          if ($files.Count -ne 10 -or
              ($observedNames -join "`n") -cne ($expectedNames -join "`n")) {
            throw 'downloaded GitHub Release asset inventory is not closed'
          }
          $inventory = @($files | ForEach-Object {
            [pscustomobject]@{
              name = $_.Name
              sha256 = (
                Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              ).Hash.ToLowerInvariant()
              size_bytes = $_.Length
              path = $_.FullName
            }
          })
          [void] (Assert-RustyFleetRemoteAssetInventory `
            -ExpectedAssets $inventory `
            -RemoteAssets @($remote.assets))

      - name: Generate fresh signed metadata for the immutable Setup
        shell: pwsh
        env:
          FLEET_DESCRIPTOR_SIGNING_KEY_PEM_BASE64: ${{ secrets.FLEET_DESCRIPTOR_SIGNING_KEY_PEM_BASE64 }}
        run: |
          if (-not $env:FLEET_DESCRIPTOR_SIGNING_KEY_PEM_BASE64) {
            throw 'metadata renewal requires the protected descriptor signing key'
          }
          $download = Join-Path $env:RUNNER_TEMP 'fleet-release-assets'
          $metadata = Join-Path $env:RUNNER_TEMP 'fleet-renewed-metadata'
          $key = Join-Path $env:RUNNER_TEMP 'fleet-descriptor-signing-key.pem'
          $productStem = if ($env:CHANNEL -ceq 'labs') {
            'RustyFleet-Labs'
          } else {
            'RustyFleet'
          }
          $setupName = "$productStem-Setup.exe"
          $setupReceiptName = "$productStem-Setup.build-receipt.json"
          try {
            [IO.File]::WriteAllBytes(
              $key,
              [Convert]::FromBase64String(
                $env:FLEET_DESCRIPTOR_SIGNING_KEY_PEM_BASE64
              )
            )
            $issued = [DateTimeOffset]::UtcNow
            $descriptorId = (
              "v$env:VERSION-$env:CHANNEL-" +
              $issued.ToUnixTimeMilliseconds()
            )
            .\packaging\windows\New-WindowsReleaseDescriptor.ps1 `
              -Version $env:VERSION `
              -Channel $env:CHANNEL `
              -Maturity $env:MATURITY `
            -ReleaseTag $env:RESOLVED_RELEASE_TAG `
              -SetupPath (Join-Path $download $setupName) `
              -SetupBuildReceiptPath (
                Join-Path $download $setupReceiptName
              ) `
              -ExpectedSetupSignerThumbprint $env:FLEET_SIGNER_THUMBPRINT `
              -ExpectedSourceRevision $env:SOURCE_REVISION `
              -ExpectedSourceTree $env:SOURCE_TREE `
              -DescriptorPrivateKeyPemPath $key `
              -ExpectedDescriptorSignerSpkiSha256 (
                $env:DESCRIPTOR_SIGNER_SPKI_SHA256
              ) `
              -OutputDirectory $metadata `
              -DescriptorId $descriptorId `
              -IssuedAtUtc $issued `
              -LifetimeMinutes 1380
          }
          finally {
            if (Test-Path -LiteralPath $key) {
              Remove-Item -LiteralPath $key -Force
            }
          }

      - name: Preflight the renewed descriptor against the closed release
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'fleet-release-assets'
          $metadata = Join-Path $env:RUNNER_TEMP 'fleet-renewed-metadata'
          $stage = Join-Path $env:RUNNER_TEMP 'fleet-renewal-preflight'
          [IO.Directory]::CreateDirectory($stage) | Out-Null
          $productStem = if ($env:CHANNEL -ceq 'labs') {
            'RustyFleet-Labs'
          } else {
            'RustyFleet'
          }
          $setupName = "$productStem-Setup.exe"
          $setupReceiptName = "$productStem-Setup.build-receipt.json"
          $bundle = "$productStem-$env:VERSION-win-x64"
          foreach ($name in @(
            $setupName,
            "$bundle.zip",
            "$bundle.zip.sha256",
            "$bundle.manifest.json",
            "$bundle.checksums.sha256",
            "$bundle.validation-receipt.json",
            $setupReceiptName
          )) {
            Copy-Item `
              -LiteralPath (Join-Path $download $name) `
              -Destination (Join-Path $stage $name)
          }
          foreach ($name in @(
            'release.json',
            'release-descriptor.receipt.json',
            'release-descriptor.spki.der'
          )) {
            Copy-Item `
              -LiteralPath (Join-Path $metadata $name) `
              -Destination (Join-Path $stage $name)
          }
          Copy-Item `
            -LiteralPath .\packaging\windows\trust\release-policy.json `
            -Destination (Join-Path $stage 'release-policy.json')
          $receipt = .\packaging\windows\Publish-WindowsRelease.ps1 `
            -Mode Preflight `
            -AssetDirectory $stage `
            -Version $env:VERSION `
            -Channel $env:CHANNEL `
            -Maturity $env:MATURITY `
            -ReleaseTag $env:RESOLVED_RELEASE_TAG `
            -ExpectedFleetSignerThumbprint $env:FLEET_SIGNER_THUMBPRINT `
            -ExpectedHostessSignerThumbprint $env:HOSTESS_SIGNER_THUMBPRINT `
            -ExpectedDescriptorSignerSpkiSha256 (
              $env:DESCRIPTOR_SIGNER_SPKI_SHA256
            ) `
            -ExpectedSourceRevision $env:SOURCE_REVISION `
            -ExpectedSourceTree $env:SOURCE_TREE `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -ExpectedRef "refs/tags/$env:RESOLVED_RELEASE_TAG"
          [IO.File]::WriteAllText(
            (Join-Path $env:RUNNER_TEMP 'metadata-preflight.json'),
            $receipt,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Read the prior deployed handoff if one exists
        shell: pwsh
        run: |
          $uri = (
            "https://mesmerprism.com/Rusty-Fleet/metadata/" +
            "$env:CHANNEL/deployment-handoff.json"
          )
          $response = Invoke-WebRequest -Uri $uri -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            [IO.File]::WriteAllText(
              (Join-Path $env:RUNNER_TEMP 'previous-handoff.json'),
              [string] $response.Content,
              [Text.UTF8Encoding]::new($false)
            )
          }
          elseif ($response.StatusCode -ne 404) {
            throw 'prior Pages metadata handoff lookup failed closed'
          }

      - name: Preserve deployed non-target metadata subtrees
        shell: pwsh
        run: |
          $existing = Join-Path $env:RUNNER_TEMP 'fleet-existing-pages'
          [IO.Directory]::CreateDirectory($existing) | Out-Null
          foreach ($channel in @('labs','stable')) {
            if ($channel -ceq $env:CHANNEL) { continue }
            foreach ($name in @('release.json','release-descriptor.receipt.json','release-descriptor.spki.der','deployment-handoff.json')) {
              $uri = "https://mesmerprism.com/Rusty-Fleet/metadata/$channel/$name"
              $response = Invoke-WebRequest -Uri $uri -SkipHttpErrorCheck
              if ($response.StatusCode -eq 404) { continue }
              if ($response.StatusCode -ne 200) { throw "existing $channel metadata lookup failed" }
              $destination = Join-Path $existing "Rusty-Fleet\metadata\$channel\$name"
              [IO.Directory]::CreateDirectory((Split-Path -Parent $destination)) | Out-Null
              if ($name.EndsWith('.der')) {
                [IO.File]::WriteAllBytes($destination, $response.Content)
              } else {
                [IO.File]::WriteAllText($destination, [string]$response.Content, [Text.UTF8Encoding]::new($false))
              }
            }
          }
      - name: Stage a binary-free resumable Pages artifact
        shell: pwsh
        run: |
          $arguments = @{
            Version = $env:VERSION
            channel = $env:CHANNEL
            Maturity = $env:MATURITY
            SiteDirectory = (Join-Path $env:RUNNER_TEMP 'fleet-public-site')
            MetadataDirectory = (
              Join-Path $env:RUNNER_TEMP 'fleet-renewed-metadata'
            )
            PublicationPreflightReceiptPath = (
              Join-Path $env:RUNNER_TEMP 'metadata-preflight.json'
            )
            ExpectedSourceRevision = $env:SOURCE_REVISION
            ExpectedSourceTree = $env:SOURCE_TREE
            ExpectedDescriptorSignerSpkiSha256 = (
              $env:DESCRIPTOR_SIGNER_SPKI_SHA256
            )
            OutputDirectory = (
              Join-Path $env:RUNNER_TEMP 'fleet-pages-artifact'
            )
            ExistingDeploymentDirectory = (
              Join-Path $env:RUNNER_TEMP 'fleet-existing-pages'
            )
            ReleaseTag = $env:RESOLVED_RELEASE_TAG
          }
          $previous = Join-Path $env:RUNNER_TEMP 'previous-handoff.json'
          if (Test-Path -LiteralPath $previous -PathType Leaf) {
            $arguments.PreviousHandoffPath = $previous
          }
          $handoff = (
            .\packaging\windows\New-WindowsPagesDeployment.ps1 @arguments
          )
          [IO.File]::WriteAllText(
            (Join-Path $env:RUNNER_TEMP 'metadata-deployment-handoff.json'),
            $handoff,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload renewal evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RustyFleet-${{ vars.FLEET_METADATA_CHANNEL }}-metadata-renewal-evidence
          path: |
            ${{ runner.temp }}/metadata-preflight.json
            ${{ runner.temp }}/metadata-deployment-handoff.json
            ${{ runner.temp }}/fleet-renewed-metadata/release.json
            ${{ runner.temp }}/fleet-renewed-metadata/release-descriptor.receipt.json
          if-no-files-found: error
          retention-days: 0
          compression-level: 6
          overwrite: false
          include-hidden-files: false
          archive: true

      - name: Dispatch the exact central Pages projection
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.FLEET_RELEASE_PUBLISH_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw 'central Pages dispatch requires the protected publication token'
          }
          $artifact = Join-Path $env:RUNNER_TEMP 'fleet-pages-artifact'
          $metadata = Join-Path $artifact (
            "Rusty-Fleet\metadata\$env:CHANNEL"
          )
          $sources = [ordered]@{
            'release.json' = (Join-Path $metadata 'release.json')
            'release-descriptor.receipt.json' = (
              Join-Path $metadata 'release-descriptor.receipt.json'
            )
            'release-descriptor.spki.der' = (
              Join-Path $metadata 'release-descriptor.spki.der'
            )
            'deployment-handoff.json' = (
              Join-Path $metadata 'deployment-handoff.json'
            )
            'metadata-preflight.json' = (
              Join-Path $env:RUNNER_TEMP 'metadata-preflight.json'
            )
          }
          $files = @(
            foreach ($entry in $sources.GetEnumerator()) {
              if (-not (Test-Path -LiteralPath $entry.Value -PathType Leaf)) {
                throw "central Pages input is absent: $($entry.Key)"
              }
              $bytes = [IO.File]::ReadAllBytes($entry.Value)
              [ordered]@{
                name = $entry.Key
                sha256 = (
                  [Convert]::ToHexString(
                    [Security.Cryptography.SHA256]::HashData($bytes)
                  ).ToLowerInvariant()
                )
                size_bytes = $bytes.Length
                content_base64 = [Convert]::ToBase64String($bytes)
              }
            }
          )
          $request = [ordered]@{
            schema = 'rusty.fleet.pages_projection_request.v1'
            source_repository = 'MesmerPrism/rusty-fleet'
            target_repository = 'MesmerPrism/MesmerPrism.github.io'
            source_run_id = [string] $env:GITHUB_RUN_ID
            version = $env:VERSION
            product_channel = $env:CHANNEL
            maturity = $env:MATURITY
            distribution_track = if ($env:CHANNEL -ceq 'labs') {
              'github-prerelease'
            } else {
              'github-release'
            }
            release_tag = $env:RESOLVED_RELEASE_TAG
            source_revision = $env:SOURCE_REVISION
            source_tree = $env:SOURCE_TREE
            fleet_signer_thumbprint = $env:FLEET_SIGNER_THUMBPRINT
            hostess_signer_thumbprint = $env:HOSTESS_SIGNER_THUMBPRINT
            descriptor_signer_spki_sha256 = (
              $env:DESCRIPTOR_SIGNER_SPKI_SHA256
            )
            files = $files
          }
          $requestText = $request | ConvertTo-Json -Depth 8 -Compress
          $requestBytes = [Text.UTF8Encoding]::new($false).GetBytes(
            $requestText
          )
          if ($requestBytes.Length -gt 45000) {
            throw 'central Pages projection request exceeds its base64-safe bound'
          }
          $requestSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($requestBytes)
          ).ToLowerInvariant()
          $dispatch = [ordered]@{
            event_type = 'fleet-pages-projection'
            client_payload = [ordered]@{
              schema = 'rusty.fleet.pages_projection_dispatch.v1'
              request_sha256 = $requestSha256
              request_base64 = [Convert]::ToBase64String($requestBytes)
            }
          }
          $dispatchPath = Join-Path $env:RUNNER_TEMP (
            'fleet-central-pages-dispatch.json'
          )
          $dispatchText = $dispatch | ConvertTo-Json -Depth 10 -Compress
          if ([Text.Encoding]::UTF8.GetByteCount($dispatchText) -gt 65535) {
            throw 'serialized repository dispatch exceeds GitHub''s payload bound'
          }
          [IO.File]::WriteAllText(
            $dispatchPath,
            $dispatchText,
            [Text.UTF8Encoding]::new($false)
          )
          try {
            gh api `
              --method POST `
              repos/MesmerPrism/MesmerPrism.github.io/dispatches `
              --input $dispatchPath | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw 'central Pages projection dispatch failed'
            }
          }
          finally {
            if (Test-Path -LiteralPath $dispatchPath) {
              Remove-Item -LiteralPath $dispatchPath -Force
            }
          }

      - name: Verify exact public central Pages readback
        shell: pwsh
        run: |
          $metadata = Join-Path $env:RUNNER_TEMP (
            "fleet-pages-artifact\Rusty-Fleet\metadata\$env:CHANNEL"
          )
          $expected = [ordered]@{}
          foreach ($name in @(
            'release.json',
            'release-descriptor.receipt.json',
            'release-descriptor.spki.der',
            'deployment-handoff.json'
          )) {
            $expected[$name] = (
              Get-FileHash `
                -Algorithm SHA256 `
                -LiteralPath (Join-Path $metadata $name)
            ).Hash.ToLowerInvariant()
          }
          $client = [Net.Http.HttpClient]::new()
          try {
            for ($attempt = 1; $attempt -le 120; $attempt++) {
              $complete = $true
              foreach ($entry in $expected.GetEnumerator()) {
                $uri = (
                  "https://mesmerprism.com/Rusty-Fleet/metadata/" +
                  "$env:CHANNEL/$($entry.Key)?fleet-renewal=" +
                  "$env:GITHUB_RUN_ID-$attempt"
                )
                try {
                  $bytes = $client.GetByteArrayAsync($uri).GetAwaiter().GetResult()
                  $sha256 = [Convert]::ToHexString(
                    [Security.Cryptography.SHA256]::HashData($bytes)
                  ).ToLowerInvariant()
                  if ($sha256 -cne $entry.Value) {
                    $complete = $false
                    break
                  }
                }
                catch {
                  $complete = $false
                  break
                }
              }
              if ($complete) {
                'Exact central Pages metadata is publicly readable.'
                exit 0
              }
              Start-Sleep -Seconds 5
            }
          }
          finally {
            $client.Dispose()
          }
          throw 'central Pages metadata did not become exactly readable in time'
