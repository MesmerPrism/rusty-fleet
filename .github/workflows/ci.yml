name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.201
      - name: Disable Visual Studio customer-experience telemetry
        if: runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          # Build Tools requires registry configuration for VSCEIP. The hosted
          # Windows runner is ephemeral, so this applies only to this job.
          $vsceipKeys = @(
            'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Wow6432Node\Microsoft\VSCommon\17.0\SQM',
            'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\VisualStudio\SQM'
          )
          foreach ($key in $vsceipKeys) {
            New-Item -Path $key -Force -ErrorAction Stop | Out-Null
            New-ItemProperty -LiteralPath $key -Name OptIn -PropertyType DWord `
              -Value 0 -Force -ErrorAction Stop | Out-Null
            $actual = Get-ItemPropertyValue -LiteralPath $key -Name OptIn `
              -ErrorAction Stop
            if ([int]$actual -ne 0) {
              throw "Visual Studio customer-experience telemetry opt-out did not persist."
            }
          }
      - name: Risk-proportional validation
        shell: pwsh
        env:
          FLEET_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          FLEET_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $base = $env:FLEET_BASE_COMMIT
          if (-not $base -or $base -match '^0+$') {
            $defaultRef = "origin/$($env:FLEET_DEFAULT_BRANCH)"
            git show-ref --verify --quiet "refs/remotes/$defaultRef"
            if ($LASTEXITCODE -ne 0) {
              git fetch --no-tags origin $env:FLEET_DEFAULT_BRANCH
              if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the default branch." }
            }
            $base = (git merge-base HEAD $defaultRef).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $base) {
              throw "Unable to resolve a non-empty validation base."
            }
          }
          .\tools\Invoke-FleetValidation.ps1 -BaseCommit $base -Execute
