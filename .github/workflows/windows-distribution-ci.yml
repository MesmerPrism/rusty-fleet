name: Windows distribution validation

on:
  push:
    paths:
      - packaging/windows/**
      - site/**
      - .github/workflows/windows-distribution-ci.yml
      - .github/workflows/release-windows.yml
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - packaging/windows/**
      - site/**
      - .github/workflows/windows-distribution-ci.yml
      - .github/workflows/release-windows.yml
      - .github/workflows/pages.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Distribution composition, tamper, install, and rollback tests
        shell: pwsh
        run: .\packaging\windows\tests\Test-WindowsDistribution.ps1
