name: Windows distribution validation

on:
  push:
    paths:
      - README.md
      - apps/fleet-setup/**
      - apps/fleet-console-wpf/RustyFleet.FleetConsole.csproj
      - apps/fleet-console-wpf/Assets/rusty-fleet.*
      - packaging/windows/**
      - schemas/rusty.fleet.windows_release*.json
      - site/**
      - .github/workflows/windows-distribution-ci.yml
      - .github/workflows/release-windows.yml
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - apps/fleet-setup/**
      - apps/fleet-console-wpf/RustyFleet.FleetConsole.csproj
      - apps/fleet-console-wpf/Assets/rusty-fleet.*
      - packaging/windows/**
      - schemas/rusty.fleet.windows_release*.json
      - site/**
      - .github/workflows/windows-distribution-ci.yml
      - .github/workflows/release-windows.yml
      - .github/workflows/pages.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.201
      - name: Distribution composition, tamper, install, and rollback tests
        shell: pwsh
        run: |
          .\packaging\windows\tests\Test-WindowsDistribution.ps1
          .\packaging\windows\tests\Test-WindowsReleaseDescriptor.ps1
          .\packaging\windows\tests\Test-WindowsReleasePolicy.ps1
