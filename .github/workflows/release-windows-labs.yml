name: Windows Labs release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable numeric asset version (X.Y.Z)
        required: true
        type: string
      alpha:
        description: Alpha tag sequence number
        required: true
        type: number
      publish_release:
        description: Create the protected GitHub prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-labs-release-${{ inputs.version }}-${{ inputs.alpha }}
  cancel-in-progress: false

jobs:
  alpha:
    environment: windows-labs-release
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      CHANNEL: labs
      TAG: v${{ inputs.version }}-alpha.${{ inputs.alpha }}
      FLEET_SIGNER_THUMBPRINT: ${{ vars.FLEET_SIGNER_THUMBPRINT }}
      HOSTESS_SIGNER_THUMBPRINT: ${{ vars.HOSTESS_SIGNER_THUMBPRINT }}
      DESCRIPTOR_SIGNER_SPKI_SHA256: ${{ vars.FLEET_DESCRIPTOR_SIGNER_SPKI_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.201

      - name: Validate alpha release identity
        shell: pwsh
        run: |
          if ($env:VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or
              $env:TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$') {
            throw 'alpha requires a numeric immutable version and vX.Y.Z-alpha.N tag'
          }
          if ($env:GITHUB_REF -ne "refs/tags/$env:TAG" -and
              '${{ inputs.publish_release }}' -eq 'true') {
            throw 'publication must run from the exact alpha tag'
          }

      - name: Run complete distribution contract suite
        shell: pwsh
        run: .\tools\Test-WindowsDistribution.ps1

      - name: Build complete signed Labs distribution
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.FLEET_LABS_WORKFLOW_TOKEN }}
          PROVIDER_URL: ${{ vars.HOSTESS_PROVIDER_URL }}
          PROVIDER_SHA256: ${{ vars.HOSTESS_PROVIDER_SHA256 }}
          PROVIDER_SIGNER: ${{ vars.HOSTESS_SIGNER_THUMBPRINT }}
          PROVIDER_PROVENANCE: ${{ vars.HOSTESS_PROVENANCE_DOCUMENT_URL }}
          PROVIDER_LICENSE: ${{ vars.HOSTESS_LICENSE_URL }}
          PROVIDER_NOTICES: ${{ vars.HOSTESS_THIRD_PARTY_NOTICES_URL }}
        run: |
          if (-not $env:GH_TOKEN -or -not $env:PROVIDER_URL -or
              -not $env:PROVIDER_SHA256 -or -not $env:PROVIDER_SIGNER -or
              -not $env:PROVIDER_PROVENANCE -or -not $env:PROVIDER_LICENSE -or
              -not $env:PROVIDER_NOTICES) {
            throw 'protected Labs workflow token and exact owner artifact inputs are required'
          }
          $before = @(gh run list --workflow release-windows.yml --limit 20 --json databaseId |
            ConvertFrom-Json | ForEach-Object databaseId)
          gh workflow run release-windows.yml --ref $env:TAG `
            -f version=$env:VERSION -f channel=labs -f maturity=alpha -f signing_mode=signed-release `
            -f publish_release='${{ inputs.publish_release }}' `
            -f hostess_provider_url=$env:PROVIDER_URL `
            -f hostess_provider_sha256=$env:PROVIDER_SHA256 `
            -f hostess_signer_thumbprint=$env:PROVIDER_SIGNER `
            -f fleet_signer_thumbprint=$env:FLEET_SIGNER_THUMBPRINT `
            -f descriptor_signer_spki_sha256=$env:DESCRIPTOR_SIGNER_SPKI_SHA256 `
            -f hostess_provenance_document_url=$env:PROVIDER_PROVENANCE `
            -f hostess_license_url=$env:PROVIDER_LICENSE `
            -f hostess_third_party_notices_url=$env:PROVIDER_NOTICES
          if ($LASTEXITCODE -ne 0) { throw 'Labs owner workflow dispatch failed' }
          $run = $null
          for ($attempt = 0; $attempt -lt 30 -and -not $run; $attempt++) {
            Start-Sleep -Seconds 2
            $run = @(gh run list --workflow release-windows.yml --branch $env:TAG --limit 20 --json databaseId |
              ConvertFrom-Json | Where-Object { $before -notcontains $_.databaseId } |
              Select-Object -First 1)
          }
          if (-not $run) { throw 'dispatched Labs owner workflow was not observable' }
          gh run watch $run.databaseId --exit-status
          if ($LASTEXITCODE -ne 0) { throw 'complete Labs owner workflow failed' }
