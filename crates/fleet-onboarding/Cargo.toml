[package]
name = "fleet-onboarding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
fleet-hub-local = { path = "../../apps/fleet-hub-local" }
fleet-onboarding-windows-kernel = { path = "../fleet-onboarding-windows-kernel" }
getrandom.workspace = true
hex.workspace = true
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-permissions.workspace = true
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
fleet-onboarding-windows-kernel = { path = "../fleet-onboarding-windows-kernel", features = [
    "test-hooks",
] }

[lints]
workspace = true
